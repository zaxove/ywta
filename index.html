<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>他与她</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://www.yanwz.cn/favicon.ico">
    <script src='https://cdn.jsdelivr.net/npm/valine@1.4.14/dist/Valine.min.js'></script>
</head>

<body>
    <div class="content">
        <div class='textwidget'>
            <div id='lovenyh' style='width: 100%; height: 100px; text-align: center; font-size: 1rem;'>
                <div id='lovenyhImage' style='width: 220px; margin: 0 auto;'><img
                        src='https://q1.qlogo.cn/g?b=qq&nk=898467886&s=640' alt='love'
                        style='width: 70px; border-radius: 50%;'><img
                        src='images/6d5ccf688f384.webp' alt='love'
                        style='width: 50px; border-radius: 50%;'><img
                        src='https://q1.qlogo.cn/g?b=qq&nk=1063573841&s=640' alt='love'
                        style='width: 70px; border-radius: 50%;'></div>
                <div cllass="Lovetime">
                    <h2>我们相识了</h2>
                    <div class="timer">
                        <b id="d"></b> Days <b id="h"></b> Hours <b id="m"></b> Minutes <b id="s"></b> Seconds
                    </div>
                    <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width="240" height="52"
                        src="//music.163.com/outchain/player?type=2&id=434902428&auto=1&height=32"></iframe>
                    <h2>留言</h2>
                    <--评论--!>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 计时器代码
        function show_date_time() {
            window.setTimeout("show_date_time()", 1000);
            var start = new Date("2021-02-20 23:30:00").getTime();  //2020-11-16 18:44:00
            var t = new Date().getTime() - start;
            var h = ~~(t / 1000 / 60 / 60 % 24);
            if (h < 10) {
                h = "0" + h;
            }
            var m = ~~(t / 1000 / 60 % 60);
            if (m < 10) {
                m = "0" + m;
            }
            var s = ~~(t / 1000 % 60);
            if (s < 10) {
                s = "0" + s;
            }
            document.getElementById('d').innerHTML = ~~(t / 1000 / 60 / 60 / 24);
            document.getElementById('h').innerHTML = h;
            document.getElementById('m').innerHTML = m;
            document.getElementById('s').innerHTML = s;
        }
        show_date_time();
        setInterval(show_date_time, 1000);
    </script>
</body>

</html>
